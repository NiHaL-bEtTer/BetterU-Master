# Local development:
#   docker compose up db          → Postgres 16 + pgvector on localhost:5432
#   docker compose up --build     → database + the full app on http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: betteru
      POSTGRES_PASSWORD: betteru
      POSTGRES_DB: betteru
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betteru"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://betteru:betteru@db:5432/betteru
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: [models:/root/.cache]   # keeps the embedding model between restarts

volumes:
  pgdata:
  models:
